name: Figma Bridge Checks

on:
  pull_request:
    paths:
      - 'scripts/figma/**'
      - 'scripts/build-plugin.mjs'
      - 'site/**'
      - 'design/figma/**'
      - 'design/meridian/**'
      - 'integrations/figma/**'
      - 'api/figma-webhook.mjs'
      - '.github/workflows/figma-*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/figma/**'
      - 'scripts/build-plugin.mjs'
      - 'site/**'
      - 'design/figma/**'
      - 'design/meridian/**'
      - 'integrations/figma/**'
      - 'api/figma-webhook.mjs'
      - '.github/workflows/figma-*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/build-plugin.mjs
      - run: git diff --exit-code -- design/figma/plugin/code.js design/figma/plugin/ui.html
      - run: node --test scripts/figma/*.test.mjs
