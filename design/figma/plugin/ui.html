<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px/1.5 system-ui;
        margin: 24px;
        color: #1c302c;
        background: #f4f6f2;
      }
      h1 {
        font-size: 22px;
      }
      label {
        display: block;
        margin-top: 16px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border: 1px solid #526a63;
        border-radius: 10px;
      }
      button {
        margin: 16px 8px 0 0;
        padding: 12px 16px;
        border: 0;
        border-radius: 24px;
        background: #235d50;
        color: #fcfdf9;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #235d50;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.5;
      }
      #status {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Publish Meridian tokens</h1>
    <p>Export Grass and Paper variables in light and dark to a draft PR in pedrobritx/meridian.</p>
    <label for="token">GitHub token — Contents: write on meridian</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" />
    <button id="publish">Publish for review</button>
    <button id="download">Download JSON</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script>
      const status = document.querySelector('#status')
      const publish = document.querySelector('#publish')
      const download = document.querySelector('#download')
      let intent
      function exportTokens(action) {
        intent = action
        publish.disabled = download.disabled = true
        status.textContent = 'Resolving Grass and Paper variables…'
        parent.postMessage({ pluginMessage: { type: 'export' } }, '*')
      }
      publish.onclick = () => {
        if (!document.querySelector('#token').value.trim()) {
          status.textContent =
            'Enter a GitHub token for this repository. It is kept only in this window.'
          return
        }
        exportTokens('publish')
      }
      download.onclick = () => exportTokens('download')
      onmessage = async (event) => {
        const message = event.data.pluginMessage
        if (!message) return
        try {
          if (message.type === 'error') throw new Error(message.message)
          if (message.type !== 'tokens') return
          if (intent === 'download') {
            const url = URL.createObjectURL(
              new Blob([JSON.stringify(message.tokens, null, 2)], { type: 'application/json' }),
            )
            const link = document.createElement('a')
            link.href = url
            link.download = 'meridian-tokens.json'
            link.click()
            URL.revokeObjectURL(url)
            status.textContent = 'Downloaded the current token export.'
          } else {
            const tokenInput = document.querySelector('#token')
            const token = tokenInput.value.trim()
            tokenInput.value = ''
            const result = await fetch('https://api.github.com/repos/pedrobritx/meridian/dispatches', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({
                event_type: 'figma-tokens',
                client_payload: { file_key: message.tokens.fileKey, tokens: message.tokens },
              }),
            })
            if (!result.ok)
              throw new Error(
                `GitHub rejected the publish request (${result.status}). Check token access and the installed workflow.`,
              )
            status.textContent =
              'Published. GitHub Actions will open or update the draft export PR. Check the Figma Design Sync workflow for its result.'
          }
        } catch (error) {
          status.textContent = error.message
        } finally {
          publish.disabled = download.disabled = false
        }
      }
    </script>
  </body>
</html>
